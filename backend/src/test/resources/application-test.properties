# ==========================================
#  Test Database Initialization (PostgreSQL)
# ==========================================

# 1. Force Spring to run schema.sql
spring.sql.init.mode=always

# 2. Explicitly point to the schema file (optional but safe)
spring.sql.init.schema-locations=classpath:schema-test.sql

# 3. Connection Pool settings (optional)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# 4. Driver (usually auto-detected, but explicit is fine)
spring.datasource.driver-class-name=org.postgresql.Driver