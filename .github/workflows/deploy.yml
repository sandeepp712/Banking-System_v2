name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/banking-api:latest

      # 4. Deploy to EC2 via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            # Navigate to the project directory
            cd ~/Banking-System_v2/backend
            
            if [ ! -f .env ]; then
              echo "❌ ERROR: .env file is missing! Aborting deployment."
              exit 1
            fi
            
            docker network inspect banking-net >/dev/null 2>&1 || docker network create banking-net
            docker inspect redis >/dev/null 2>&1 && docker start redis || docker run -d \
              --name redis \
              --network banking-net \
              --memory 128m \
              --restart unless-stopped \
              redis:7 redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru


            # Pull the latest image from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/banking-api:latest
            
            # Stop and remove the old container (if it exists)
            docker stop banking-api || true
            docker rm banking-api || true
            
            # Run the new container with the .env file
            docker run -d \
              --name banking-api \
              --network banking-net \
              --env-file .env \
              -p 8080:8080 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/banking-api:latest
            
            
            # Wait for the app to start (max 60 seconds)
            echo "Waiting for banking-api to become healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "✅ Application is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Application failed to start. Printing logs:"
                docker logs banking-api --tail 50
                exit 1
              fi
              sleep 2
            done
            
            
            # Clean up old, unused images to save disk space
            docker image prune -f
            echo "✅ Deployment complete!"